<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SECam Diagnostics</title>
<style>
  :root { --bg: #0e0f12; --panel: #1a1c21; --text: #e9eaee; --muted: #9a9ca5; --ok: #2fbf71; --err: #e5534b; --warn: #f0a83a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 -apple-system, BlinkMacSystemFont, sans-serif;
    padding: calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom)); }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p { color: var(--muted); margin: 0 0 16px; font-size: 14px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 20px 0 6px; }
  .row { display: flex; gap: 8px; align-items: baseline; padding: 8px 10px; background: var(--panel); border-radius: 8px; margin-bottom: 4px; font-size: 13px; }
  .name { flex: 1; min-width: 0; word-break: break-all; }
  .res { flex: none; font-weight: 600; }
  .ok { color: var(--ok); } .err { color: var(--err); } .wait { color: var(--warn); }
  button { font: inherit; border: 0; border-radius: 10px; padding: 12px 16px; background: #3d8bfd; color: #fff; width: 100%; margin-top: 16px; }
  textarea { width: 100%; height: 160px; margin-top: 8px; background: var(--panel); color: var(--text); border: 0; border-radius: 8px; padding: 8px; font: 11px/1.3 ui-monospace, Menlo, monospace; }
</style>
</head>
<body>
<h1>Диагностика сети</h1>
<p>Проверяет, какие сигнальные и STUN-серверы доступны с этого устройства. Видео не передаётся. Дождитесь окончания и нажмите «Скопировать отчёт».
Серверы, которые использует SECam, отмечены ★.</p>
<div id="out"></div>
<button id="copy">Скопировать отчёт</button>
<textarea id="report" readonly></textarea>
<script>
'use strict';
const rnd = () => Math.random().toString(36).slice(2, 10);
const GROUPS = [
  ['PeerJS', [
    { url: `wss://0.peerjs.com/peerjs?key=peerjs&id=secam-diag-${rnd()}&token=x&version=1.5.4` , label: '0.peerjs.com' },
  ]],
  ['Nostr', ['relay.damus.io', 'nos.lol ★', 'relay.primal.net ★', 'relay.nostr.band', 'nostr.mom ★', 'relay.snort.social',
    'nostr-pub.wellorder.net', 'relay.nostr.bg', 'nostr.oxtr.dev', 'offchain.pub', 'relay.mostr.pub', 'nostr.wine']
    .map((h) => { const used = h.endsWith(' ★'); const name = used ? h.slice(0, -2) : h; return { url: `wss://${name}`, label: h }; })],
  ['MQTT', [
    { url: 'wss://broker.emqx.io:8084/mqtt', label: 'broker.emqx.io ★', proto: 'mqtt' },
    { url: 'wss://broker.hivemq.com:8884/mqtt', label: 'broker.hivemq.com ★', proto: 'mqtt' },
    { url: 'wss://test.mosquitto.org:8081/mqtt', label: 'test.mosquitto.org ★', proto: 'mqtt' },
    { url: 'wss://public.mqtthq.com:8084/mqtt', label: 'public.mqtthq.com', proto: 'mqtt' },
  ]],
  ['WebTorrent трекеры', ['tracker.openwebtorrent.com', 'tracker.webtorrent.dev', 'tracker.btorrent.xyz', 'tracker.files.fm:7073/announce']
    .map((h) => ({ url: `wss://${h}`, label: h }))],
];
const STUN = ['stun:stun.l.google.com:19302', 'stun:stun.cloudflare.com:3478 ★', 'stun:stun.services.mozilla.com:3478',
  'stun:stun.nextcloud.com:443', 'stun:stun.sipnet.ru:3478 ★', 'stun:stun.voipgate.com:3478'];

const out = document.getElementById('out');
const results = [];
function addRow(group, label) {
  const div = document.createElement('div');
  div.className = 'row';
  div.innerHTML = '<span class="name"></span><span class="res wait">…</span>';
  div.querySelector('.name').textContent = label;
  out.appendChild(div);
  return (ok, detail) => {
    const r = div.querySelector('.res');
    r.className = 'res ' + (ok ? 'ok' : 'err');
    r.textContent = detail;
    results.push(`${ok ? 'OK  ' : 'FAIL'} ${group} ${label} ${detail}`);
    updateReport();
  };
}

function probeWs({ url, proto }, done) {
  const t0 = performance.now();
  let settled = false, ws;
  const finish = (ok, d) => { if (settled) return; settled = true; clearTimeout(timer); try { ws.close(); } catch {} done(ok, d); };
  const timer = setTimeout(() => finish(false, 'таймаут 10 с'), 10000);
  try { ws = proto ? new WebSocket(url, proto) : new WebSocket(url); }
  catch (e) { return finish(false, e.message); }
  ws.onopen = () => finish(true, Math.round(performance.now() - t0) + ' мс');
  ws.onclose = (e) => finish(false, 'закрыт, code ' + e.code);
}

function probeStun(url, done) {
  const t0 = performance.now();
  let settled = false;
  const pc = new RTCPeerConnection({ iceServers: [{ urls: url }] });
  const finish = (ok, d) => { if (settled) return; settled = true; clearTimeout(timer); pc.close(); done(ok, d); };
  const timer = setTimeout(() => finish(false, 'нет ответа 8 с'), 8000);
  pc.onicecandidate = (e) => {
    if (e.candidate && / typ srflx /.test(e.candidate.candidate)) finish(true, Math.round(performance.now() - t0) + ' мс');
    if (!e.candidate) finish(false, 'нет srflx');
  };
  pc.createDataChannel('x');
  pc.createOffer().then((o) => pc.setLocalDescription(o)).catch((e) => finish(false, e.message));
}

async function probeHttp(label, url, done) {
  const t0 = performance.now();
  try {
    await fetch(url, { mode: 'no-cors', cache: 'no-store' });
    done(true, Math.round(performance.now() - t0) + ' мс');
  } catch (e) { done(false, e.message); }
}

function updateReport() {
  document.getElementById('report').value =
    `SECam diag ${new Date().toISOString()}\n${navigator.userAgent}\n\n` + results.join('\n');
}

function h2(text) { const h = document.createElement('h2'); h.textContent = text; out.appendChild(h); }

h2('HTTPS');
for (const [label, url] of [['cdn.jsdelivr.net', 'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/package.json'],
  ['unpkg.com', 'https://unpkg.com/peerjs@1.5.4/package.json'], ['esm.sh', 'https://esm.sh/'],
  ['0.peerjs.com', 'https://0.peerjs.com/peerjs/id']]) probeHttp(label, url, addRow('HTTPS', label));
for (const [group, items] of GROUPS) {
  h2(group);
  for (const it of items) probeWs(it, addRow(group, it.label));
}
h2('STUN');
for (const s of STUN) {
  const used = s.endsWith(' ★'), url = used ? s.slice(0, -2) : s;
  probeStun(url, addRow('STUN', url.replace('stun:', '') + (used ? ' ★' : '')));
}

document.getElementById('copy').onclick = async () => {
  const ta = document.getElementById('report');
  try { await navigator.clipboard.writeText(ta.value); document.getElementById('copy').textContent = 'Скопировано'; }
  catch { ta.select(); document.execCommand('copy'); }
};
</script>
</body>
</html>
